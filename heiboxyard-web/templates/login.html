<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>访问验证</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #fff;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 400px;
            transition: transform 0.2s;
        }
        .login-box h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: 500;
            color: #1a1a1a;
        }
        .login-box .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .error {
            color: #dc2626;
            background: #fee2e2;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
            border: 1px solid #fecaca;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s;
            background: #fafafa;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1a1a1a;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(26,26,26,0.08);
        }
        button {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 6px;
        }
        button:hover { opacity: 0.88; }
        button:active { transform: scale(0.98); }
        .hint {
            margin-top: 18px;
            font-size: 13px;
            color: #888;
            text-align: center;
        }
        .hint span {
            display: inline-block;
            background: #f0f0f0;
            padding: 2px 10px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #555;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #bbb;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 18px;
        }
        @media (max-width: 480px) {
            .login-box { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 访问验证</h2>
        <div class="subtitle">请输入密码以继续访问</div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/auth">
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required autofocus>
            </div>
            <input type="hidden" name="next" value="{{ next_url }}">
            <button type="submit">确认</button>
        </form>

        <div class="footer-note">
            heiboxyard · 每日首次访问需验证
        </div>
    </div>
</body>
</html>
